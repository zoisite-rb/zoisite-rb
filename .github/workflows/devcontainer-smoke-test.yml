name: Devcontainer smoke test

on: push

jobs:
  build:
    name: Devcontainer smoke test

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false

    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Generate zoisite app sqlite3
        run: bundle exec railties/exe/zoisite new myapp_sqlite --database="sqlite3" --dev --devcontainer

      - name: Test devcontainer sqlite3
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          subFolder: myapp_sqlite
          imageName: ghcr.io/zoisite/smoke-test-devcontainer
          cacheFrom: ghcr.io/zoisite/smoke-test-devcontainer
          imageTag: sqlite3
          push: ${{ github.repository == 'zoisite-rb/zoisite-rb' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/main
          runCmd: bin/zoisite g scaffold Post && bin/zoisite db:migrate && bin/zoisite test

      - name: Stop all containers
        run: docker ps -q | xargs docker stop

      - name: Generate zoisite app postgresql
        run: bundle exec railties/exe/zoisite new myapp_postgresql --database="postgresql" --dev --devcontainer

      - name: Test devcontainer postgresql
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          subFolder: myapp_postgresql
          imageName: ghcr.io/zoisite/smoke-test-devcontainer
          cacheFrom: ghcr.io/zoisite/smoke-test-devcontainer
          imageTag: postgresql
          push: ${{ github.repository == 'zoisite-rb/zoisite-rb' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/main
          runCmd: bin/zoisite g scaffold Post && bin/zoisite db:migrate && bin/zoisite test && bin/zoisite test:system

      - name: Stop all containers
        run: docker ps -q | xargs docker stop

      - name: Generate zoisite app mysql
        run: bundle exec railties/exe/zoisite new myapp_mysql --database="mysql" --dev --devcontainer

      - name: Test devcontainer mysql
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          subFolder: myapp_mysql
          imageName: ghcr.io/zoisite/smoke-test-devcontainer
          cacheFrom: ghcr.io/zoisite/smoke-test-devcontainer
          imageTag: mysql
          push: ${{ github.repository == 'zoisite-rb/zoisite-rb' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/main
          runCmd: bin/zoisite g scaffold Post && bin/zoisite db:migrate && bin/zoisite test

      - name: Stop all containers
        run: docker ps -q | xargs docker stop

      - name: Generate zoisite app trilogy
        run: bundle exec railties/exe/zoisite new myapp_trilogy --database="trilogy" --dev --devcontainer

      - name: Test devcontainer trilogy
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          subFolder: myapp_trilogy
          imageName: ghcr.io/zoisite/smoke-test-devcontainer
          cacheFrom: ghcr.io/zoisite/smoke-test-devcontainer
          imageTag: trilogy
          push: ${{ github.repository == 'zoisite-rb/zoisite-rb' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/main
          runCmd: bin/zoisite g scaffold Post && bin/zoisite db:migrate && bin/zoisite test

      - name: Stop all containers
        run: docker ps -q | xargs docker stop
